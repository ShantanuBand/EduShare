openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: College Resource Sharing Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: resources
    description: Resource management
  - name: users
    description: User management
  - name: comments
    description: Comment operations
  - name: ratings
    description: Rating operations
  - name: bookmarks
    description: Bookmark operations
  - name: colleges
    description: College management
  - name: categories
    description: Category management
  - name: likes
    description: Like operations
  - name: discussions
    description: Discussion and Q&A operations
  - name: reports
    description: Content moderation operations
  - name: notifications
    description: User notifications
  - name: admin
    description: Admin operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout user
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /resources:
    get:
      operationId: listResources
      tags: [resources]
      summary: List resources with filters
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 12
        - name: search
          in: query
          schema:
            type: string
        - name: collegeId
          in: query
          schema:
            type: integer
        - name: categoryId
          in: query
          schema:
            type: integer
        - name: branch
          in: query
          schema:
            type: string
        - name: semester
          in: query
          schema:
            type: integer
        - name: fileType
          in: query
          schema:
            type: string
        - name: topic
          in: query
          schema:
            type: string
        - name: academicYear
          in: query
          schema:
            type: integer
        - name: examType
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [newest, popular, mostDownloaded, topRated]
            default: newest
      responses:
        "200":
          description: List of resources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourcesListResponse"

    post:
      operationId: createResource
      tags: [resources]
      summary: Upload a new resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResourceRequest"
      responses:
        "201":
          description: Resource created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /resources/{id}:
    get:
      operationId: getResource
      tags: [resources]
      summary: Get a resource by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resource detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      operationId: updateResource
      tags: [resources]
      summary: Update a resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateResourceRequest"
      responses:
        "200":
          description: Resource updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"

    delete:
      operationId: deleteResource
      tags: [resources]
      summary: Delete a resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resource deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /resources/{id}/download:
    post:
      operationId: incrementDownload
      tags: [resources]
      summary: Increment download count
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Download count incremented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /resources/{id}/comments:
    get:
      operationId: listComments
      tags: [comments]
      summary: Get comments for a resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"

    post:
      operationId: createComment
      tags: [comments]
      summary: Add a comment to a resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /comments/{id}:
    delete:
      operationId: deleteComment
      tags: [comments]
      summary: Delete a comment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /resources/{id}/rating:
    post:
      operationId: rateResource
      tags: [ratings]
      summary: Rate a resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateResourceRequest"
      responses:
        "200":
          description: Rating saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /bookmarks:
    get:
      operationId: listBookmarks
      tags: [bookmarks]
      summary: Get user bookmarks
      responses:
        "200":
          description: Bookmarked resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"

  /bookmarks/{resourceId}:
    post:
      operationId: addBookmark
      tags: [bookmarks]
      summary: Bookmark a resource
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Bookmarked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

    delete:
      operationId: removeBookmark
      tags: [bookmarks]
      summary: Remove a bookmark
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Bookmark removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /colleges:
    get:
      operationId: listColleges
      tags: [colleges]
      summary: List all colleges
      responses:
        "200":
          description: List of colleges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/College"

    post:
      operationId: createCollege
      tags: [colleges]
      summary: Create a college
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCollegeRequest"
      responses:
        "201":
          description: College created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/College"

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /users/profile:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Get user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

    put:
      operationId: updateUserProfile
      tags: [users]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users/{id}/resources:
    get:
      operationId: getUserResources
      tags: [users]
      summary: Get resources uploaded by user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User's resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get platform stats
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: List all users (admin)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersListResponse"

  /admin/users/{id}/status:
    put:
      operationId: updateUserStatus
      tags: [admin]
      summary: Block/unblock a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserStatusRequest"
      responses:
        "200":
          description: User status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/resources:
    get:
      operationId: adminListResources
      tags: [admin]
      summary: List all resources (admin)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: List of resources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourcesListResponse"

  /admin/resources/{id}/status:
    put:
      operationId: updateResourceStatus
      tags: [admin]
      summary: Approve/reject a resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateResourceStatusRequest"
      responses:
        "200":
          description: Resource status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"


  /resources/{id}/like:
    post:
      operationId: likeResource
      tags: [likes]
      summary: Like a resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Liked successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
    delete:
      operationId: unlikeResource
      tags: [likes]
      summary: Unlike a resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unliked successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: Get user notifications
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsListResponse"

  /notifications/{id}/read:
    put:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /users/{id}/profile:
    get:
      operationId: getUserProfilePublic
      tags: [users]
      summary: Get public user profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUserProfile"

  /ai/assist:
    post:
      operationId: aiAssist
      tags: [resources]
      summary: Get AI assistance for a resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiAssistRequest"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAssistResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required: [error]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    RegisterRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        collegeName:
          type: string
        branch:
          type: string
        semester:
          type: integer
      required: [name, email, password]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        message:
          type: string
      required: [user, message]

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [student, admin]
        branch:
          type: string
          nullable: true
        semester:
          type: integer
          nullable: true
        collegeId:
          type: integer
          nullable: true
        collegeName:
          type: string
          nullable: true
        isBlocked:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, name, email, role, isBlocked, createdAt]

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
        branch:
          type: string
          nullable: true
        semester:
          type: integer
          nullable: true
        collegeId:
          type: integer
          nullable: true
        collegeName:
          type: string
          nullable: true
        uploadCount:
          type: integer
        downloadCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, name, email, role, uploadCount, downloadCount, createdAt]

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
        branch:
          type: string
        semester:
          type: integer
        collegeId:
          type: integer

    Resource:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        fileName:
          type: string
        fileType:
          type: string
        fileSize:
          type: integer
        fileUrl:
          type: string
        subject:
          type: string
          nullable: true
        branch:
          type: string
          nullable: true
        semester:
          type: integer
          nullable: true
        tags:
          type: array
          items:
            type: string
        downloadCount:
          type: integer
        viewCount:
          type: integer
        status:
          type: string
          enum: [pending, approved, rejected]
        uploaderId:
          type: integer
        uploaderName:
          type: string
        collegeId:
          type: integer
          nullable: true
        collegeName:
          type: string
          nullable: true
        categoryId:
          type: integer
          nullable: true
        categoryName:
          type: string
          nullable: true
        averageRating:
          type: number
          nullable: true
        ratingCount:
          type: integer
        likesCount:
          type: integer
        isLiked:
          type: boolean
        isBookmarked:
          type: boolean
        topic:
          type: string
          nullable: true
        academicYear:
          type: integer
          nullable: true
        examType:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, title, fileName, fileType, fileSize, fileUrl, downloadCount, viewCount, status, uploaderId, uploaderName, ratingCount, likesCount, isLiked, isBookmarked, createdAt, tags]

    ResourceDetail:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          properties:
            comments:
              type: array
              items:
                $ref: "#/components/schemas/Comment"
            userRating:
              type: integer
              nullable: true
          required: [comments]

    ResourcesListResponse:
      type: object
      properties:
        resources:
          type: array
          items:
            $ref: "#/components/schemas/Resource"
        total:
          type: integer
        page:
          type: integer
        totalPages:
          type: integer
      required: [resources, total, page, totalPages]

    CreateResourceRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        fileName:
          type: string
        fileType:
          type: string
        fileSize:
          type: integer
        fileUrl:
          type: string
        subject:
          type: string
        branch:
          type: string
        semester:
          type: integer
        tags:
          type: array
          items:
            type: string
        categoryId:
          type: integer
        collegeId:
          type: integer
        topic:
          type: string
        academicYear:
          type: integer
        examType:
          type: string
      required: [title, fileName, fileType, fileSize, fileUrl]

    UpdateResourceRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        subject:
          type: string
        branch:
          type: string
        semester:
          type: integer
        tags:
          type: array
          items:
            type: string
        categoryId:
          type: integer
        topic:
          type: string
        academicYear:
          type: integer
        examType:
          type: string

    Comment:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
        userId:
          type: integer
        userName:
          type: string
        resourceId:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, content, userId, userName, resourceId, createdAt]

    CreateCommentRequest:
      type: object
      properties:
        content:
          type: string
      required: [content]

    RateResourceRequest:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
      required: [rating]

    College:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        domain:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        university:
          type: string
          nullable: true
        resourceCount:
          type: integer
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, name, resourceCount, memberCount, createdAt]

    CreateCollegeRequest:
      type: object
      properties:
        name:
          type: string
        domain:
          type: string
        city:
          type: string
        state:
          type: string
        university:
          type: string
      required: [name]

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        resourceCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, name, resourceCount, createdAt]

    CreateCategoryRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
      required: [name]

    AdminStats:
      type: object
      properties:
        totalUsers:
          type: integer
        totalResources:
          type: integer
        totalDownloads:
          type: integer
        totalColleges:
          type: integer
        pendingResources:
          type: integer
        recentUploads:
          type: integer
      required: [totalUsers, totalResources, totalDownloads, totalColleges, pendingResources, recentUploads]

    UsersListResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
        page:
          type: integer
        totalPages:
          type: integer
      required: [users, total, page, totalPages]

    UpdateUserStatusRequest:
      type: object
      properties:
        isBlocked:
          type: boolean
      required: [isBlocked]

    UpdateResourceStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum: [approved, rejected]
        reason:
          type: string
      required: [status]


    PublicUserProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        avatarUrl:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        collegeName:
          type: string
          nullable: true
        university:
          type: string
          nullable: true
        branch:
          type: string
          nullable: true
        semester:
          type: integer
          nullable: true
        uploadedMaterials:
          type: integer
        likesReceived:
          type: integer
      required: [id, name, uploadedMaterials, likesReceived]

    Notification:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        type:
          type: string
        message:
          type: string
        isRead:
          type: boolean
        link:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, userId, type, message, isRead, createdAt]

    NotificationsListResponse:
      type: array
      items:
        $ref: "#/components/schemas/Notification"

    AiAssistRequest:
      type: object
      properties:
        resourceId:
          type: integer
        prompt:
          type: string
        action:
          type: string
          enum: [summarize, qa, flashcards, mcq]
      required: [resourceId, prompt, action]

    AiAssistResponse:
      type: object
      properties:
        response:
          type: string
      required: [response]
